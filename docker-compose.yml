services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regulatory
      POSTGRES_PASSWORD: regulatory
      POSTGRES_DB: regulatory_intel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulatory -d regulatory_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://regulatory:regulatory@db:5432/regulatory_intel
      API_HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "*"
      RUN_INITIAL_INGEST: "true"
      PUBLIC_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

services:
  - type: web
    name: regulatory-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: regulatory-intelligence-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: RUN_INITIAL_INGEST
        value: "true"
      - key: API_HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        sync: false

databases:
  - name: regulatory-intelligence-db
    plan: free
    databaseName: regulatory_intel
    user: regulatory
    ipAllowList: []

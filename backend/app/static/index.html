<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daily crypto, tech, and AI regulatory updates from official government and regulator sources across global jurisdictions." />
  <title>Regulatory Intelligence — Official Regulatory News</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow">Official sources only</p>
      <h1>Regulatory Intelligence</h1>
      <p>Track crypto, tech, and AI regulation across UAE, Hong Kong, Singapore, the US, Africa, and the EU — straight from regulators.</p>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" class="active" data-tab="feed">Feed</button>
      <button type="button" data-tab="digest">Daily Digest</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="panel sidebar" id="prefs"></aside>
    <section class="main-column">
      <section class="panel filters" id="filters"></section>
      <section class="panel" id="feed-panel"></section>
      <section class="panel hidden" id="digest-panel"></section>
    </section>
  </main>

  <footer class="site-footer">
    <p>All links point to official regulator publications. Not legal advice.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
